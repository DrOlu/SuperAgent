name: SuperAgent Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run ID to pull installers from"
        required: true
        default: "31267479896"
      tag:
        description: "Release tag (e.g. v2.0.3)"
        required: true
        default: "v2.0.3"

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish installers to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten installers + checksums
        shell: bash
        run: |
          mkdir -p release
          # Only real electron-builder installers + update manifests.
          # Match by name prefix so bundled tooling exes (git.exe, sh.exe, …)
          # that leak into the unpacked portable artifact are NOT published.
          find artifacts -type f \( \
            -name "SuperAgent-*.dmg" -o -name "SuperAgent-*.zip" \
            -o -name "SuperAgent-*-setup.exe" -o -name "SuperAgent-*-portable.exe" \
            -o -name "SuperAgent-*.AppImage" -o -name "SuperAgent-*.deb" \
            -o -name "SuperAgent-*.rpm" -o -name "SuperAgent-*.blockmap" \
            -o -name "latest*.yml" \) \
            -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
          echo "=== release contents ==="
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SuperAgent ${{ inputs.tag }}
          body: |
            # SuperAgent ${{ inputs.tag }}

            SuperAgent — a rebranded AI assistant, maintained by **Hyperspace Technologies** (`agent@superagent.ng`).

            Built from the open-source Cherry Studio codebase under its original (AGPLv3) license. Only visible branding, strings, and the app icon/logo were changed; functional code is unmodified.

            ## Installers
            - **macOS**: `.dmg` (arm64 / x64) and `.zip`
            - **Windows**: `.exe` (NSIS setup + portable, x64 / arm64)
            - **Linux**: `.AppImage`, `.deb`, `.rpm` (x64 / arm64)

            See `SHA256SUMS.txt` for checksums.
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
