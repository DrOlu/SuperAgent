name: Sync Upstream & Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if version unchanged (true/false)'
        required: false
        default: 'false'
      upstream_tag:
        description: 'Specific upstream tag to sync (e.g. v1.2.5). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
    steps:
      - name: Checkout SuperAgent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
          UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag }}
        run: |
          # Read current version from the repo
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current SuperAgent version: $CURRENT_VERSION"

          if [ -n "$UPSTREAM_TAG" ]; then
            LATEST_TAG="$UPSTREAM_TAG"
          else
            LATEST_TAG=$(curl -sL \
              -H "Authorization: token $GH_TOKEN" \
              https://api.github.com/repos/0-AI-UG/cate/releases/latest \
              | jq -r '.tag_name')
          fi

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No upstream release found"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "upstream_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_VERSION="${LATEST_TAG#v}"
          echo "Latest upstream version: $UPSTREAM_VERSION"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

          # Check if this version is already released on origin (not just package.json)
          EXISTING_RELEASE=$(curl -sL \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${UPSTREAM_VERSION}" \
            | jq -r '.tag_name // empty')

          if [ -n "$EXISTING_RELEASE" ] && [ "$FORCE" != "true" ]; then
            echo "Release v${UPSTREAM_VERSION} already exists on GitHub. No action needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM_VERSION" = "$CURRENT_VERSION" ] && [ "$FORCE" != "true" ]; then
            echo "Already up to date (v$CURRENT_VERSION). No release needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version or force flag set. Will sync and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  sync-and-rebrand:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.check-and-sync.outputs.upstream_version }}
    steps:
      - name: Checkout SuperAgent
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUPERAGENT_PAT }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "SuperAgent Bot"
          git config user.email "superagent@hyperspace.ng"

      - name: Snapshot SuperAgent-owned files
        run: |
          # Snapshot ALL our workflow files + branding assets before the merge.
          # These are restored verbatim after the upstream merge, so upstream
          # can never delete or overwrite our CI/CD workflows or brand assets.
          mkdir -p /tmp/sa-snap/.github/workflows
          mkdir -p /tmp/sa-snap/assets
          mkdir -p /tmp/sa-snap/src/renderer/assets

          # Workflow files
          cp .github/workflows/*.yml /tmp/sa-snap/.github/workflows/ 2>/dev/null || true

          # Branding assets
          cp assets/superagent-logo.svg /tmp/sa-snap/assets/ 2>/dev/null || true
          cp src/renderer/assets/superagent-logo.svg /tmp/sa-snap/src/renderer/assets/ 2>/dev/null || true
          cp scripts/rebrand.sh /tmp/sa-snap/ 2>/dev/null || true

          echo "Snapshotted $(find /tmp/sa-snap -type f | wc -l) SuperAgent-owned files:"
          find /tmp/sa-snap -type f | sort

      - name: Sync from upstream
        env:
          UPSTREAM_VERSION: ${{ needs.check-and-sync.outputs.upstream_version }}
        run: |
          git remote add upstream https://github.com/0-AI-UG/cate.git
          git fetch upstream --tags --force

          UPSTREAM_TAG="v${UPSTREAM_VERSION}"
          echo "Syncing from upstream tag: $UPSTREAM_TAG"

          if ! git rev-parse "${UPSTREAM_TAG}" >/dev/null 2>&1; then
            echo "ERROR: Upstream tag $UPSTREAM_TAG not found!"
            exit 1
          fi

          # Create sync branch from the upstream tag
          git checkout -b sync-upstream "${UPSTREAM_TAG}"

          # Update version in package.json
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${UPSTREAM_VERSION}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

          git add -A
          git commit -m "Sync v${UPSTREAM_VERSION} from upstream Cate" || true

          # Switch back to main and merge
          git checkout main

          if ! git merge sync-upstream --allow-unrelated-histories --no-edit 2>&1; then
            echo "Merge conflicts detected, resolving with upstream (theirs) for non-owned files..."
            CONFLICTS=$(git ls-files -u | awk '{print $4}' | sort -u)
            echo "$CONFLICTS" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! git checkout --theirs "$f" 2>/dev/null; then
                echo "  Upstream deleted $f — removing"
                git rm -f "$f" 2>/dev/null || true
              else
                git add "$f"
              fi
            done
            git commit --no-edit || true
          fi

          git branch -D sync-upstream 2>/dev/null || true

      - name: Restore SuperAgent-owned files
        run: |
          # Restore all snapshotted files — our versions always win.
          # This is the key fix: we restore AFTER the merge, not using ORIG_HEAD.
          cp /tmp/sa-snap/.github/workflows/*.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/sa-snap/assets/superagent-logo.svg assets/ 2>/dev/null || true
          cp /tmp/sa-snap/src/renderer/assets/superagent-logo.svg src/renderer/assets/ 2>/dev/null || true
          cp /tmp/sa-snap/rebrand.sh scripts/ 2>/dev/null || true

          echo "Restored SuperAgent-owned files."
          echo "Current .github/workflows/:"
          ls .github/workflows/

      - name: Apply SuperAgent rebrand
        run: |
          bash scripts/rebrand.sh

      - name: Commit and push
        env:
          UPSTREAM_VERSION: ${{ needs.check-and-sync.outputs.upstream_version }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes (branding already applied)."
          else
            git commit -m "Sync v${UPSTREAM_VERSION} from upstream Cate + apply SuperAgent rebrand"
          fi

          git push --force-with-lease origin main

          # Tag and push
          git tag -f "v${UPSTREAM_VERSION}"
          git push origin "v${UPSTREAM_VERSION}" --force

          echo "Sync complete. v${UPSTREAM_VERSION} pushed and tagged."

      - name: Verify workflow files survived
        run: |
          echo "=== Workflow files on main after push ==="
          ls -la .github/workflows/
          MISSING=""
          for f in sync-and-release.yml ci.yml release.yml notify-multica-release.yml; do
            if [ ! -f ".github/workflows/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing workflow files after push:$MISSING"
            exit 1
          fi
          echo "All key workflow files present. ✅"

  build-and-release:
    needs: [check-and-sync, sync-and-rebrand]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release (triggers release.yml via tag push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-and-sync.outputs.upstream_version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — release.yml will have handled assets."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "SuperAgent $TAG" \
              --generate-notes \
              --draft
            echo "Draft release $TAG created — release.yml will populate assets and publish."
          fi
